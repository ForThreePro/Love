<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Lucero Paucar 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(135deg, #ff9ec9 0%, #ffd6e8 100%);
    font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { position: fixed; top:0; left:0; z-index: 0; }
  
  .container {
    position: relative; z-index: 2; text-align: center; 
    background: rgba(255,255,255,0.95); padding: 40px; border-radius: 30px;
    box-shadow: 0 15px 50px rgba(214,51,132,0.3); max-width: 550px; animation: fadeIn 1s;
  }
  @keyframes fadeIn { from{opacity:0; transform:scale(0.8)} to{opacity:1; transform:scale(1)} }
  h1 { color: #d63384; font-size: 2.5em; margin-bottom: 10px; font-family: 'Dancing Script', cursive; }
  .btn {
    padding: 15px 40px; font-size: 1.3em; border: none; border-radius: 50px;
    cursor: pointer; margin: 10px; font-weight: bold; transition: 0.3s;
  }
  #si { background: #ff5e94; color: white; }
  #si:hover { transform: scale(1.1) rotate(-2deg); box-shadow: 0 10px 30px rgba(255,94,148,0.5); }
  #no { background: white; color: #ff5e94; position: absolute; border: 2px solid #ff5e94; transition: all 0.2s; }
  
  #btnMusica {
    position: fixed; top: 20px; right: 20px; z-index: 999;
    background: rgba(255,255,255,0.9); border: none; border-radius: 50%;
    width: 50px; height: 50px; font-size: 1.5em; cursor: pointer; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  
  .piropos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
  .piropo {
    background: linear-gradient(45deg, #ff5e94, #ff9ec9); color: white; 
    padding: 10px 18px; border-radius: 25px; font-weight: 600; animation: pop 0.5s;
  }
  @keyframes pop { 0%{transform:scale(0) rotate(-180deg)} 100%{transform:scale(1) rotate(0)} }
  
  #carta {
    font-family: 'Dancing Script', cursive; font-size: 1.5em; color: #d63384;
    text-align: left; margin-top: 20px; min-height: 120px; line-height: 1.6;
  }
  .cursor { animation: blink 1s infinite; }
  @keyframes blink { 50%{opacity:0} }
  .hidden { display: none; }
  
  /* LLUVIA DE NOMBRES */
  .nombre-flotante {
    position: fixed; font-size: 1.5em; font-weight: bold; color: #ff5e94;
    pointer-events: none; animation: flotar 4s linear forwards; z-index: 10;
    text-shadow: 0 2px 10px rgba(255,94,148,0.3);
  }
  @keyframes flotar {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }
  
  /* ANILLO 3D */
  #pantalla3 { animation: zoom 1s; }
  @keyframes zoom { from{transform:scale(0.5)} to{transform:scale(1)} }
  .anillo {
    width: 150px; height: 150px; margin: 20px auto; position: relative;
    animation: girar 3s linear infinite; transform-style: preserve-3d;
  }
  @keyframes girar { from{transform: rotateY(0deg)} to{transform: rotateY(360deg)} }
  .anillo-circulo {
    width: 150px; height: 150px; border: 12px solid #ffd700; border-radius: 50%;
    box-shadow: 0 0 30px #ffd700, inset 0 0 20px #fff;
  }
  .diamante {
    width: 30px; height: 30px; background: white; position: absolute;
    top: -15px; left: 60px; transform: rotate(45deg);
    box-shadow: 0 0 20px rgba(255,255,255,0.8);
  }
  .btn-final { background: #ff5e94; color: white; font-size: 1.5em; padding: 20px 50px; }
  .btn-final:hover { transform: scale(1.1); }
</style>
</head>
<body>

<canvas id="hearts"></canvas>

<button id="btnMusica" onclick="toggleMusica()">▶️</button>
<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="container" id="pantalla1">
  <h1>Lucero Paucar 🥺</h1>
  <p style="color:#a63a6a; font-size:1.2em;">Tengo algo muy importante que decirte...</p>
  <h1>¿Quieres ser mi novia?</h1>
  <button class="btn" id="si" onclick="aceptar()">SÍ ❤️</button>
  <button class="btn" id="no">NO</button>
</div>

<div class="container hidden" id="pantalla2">
  <h1>¡Sabía que dirías SÍ! 😍💖</h1>
  <p style="font-size:1.2em; color:#a63a6a;">Porque tú eres:</p>
  <div class="piropos" id="piropos"></div>
  <div id="carta"></div>
  <button class="btn" style="margin-top:20px; background:#ff5e94; color:white;" onclick="propuesta()">Continuar 💍</button>
</div>

<div class="container hidden" id="pantalla3">
  <h1>Última pregunta... 🥺</h1>
  <div class="anillo">
    <div class="anillo-circulo"></div>
    <div class="diamante"></div>
  </div>
  <h1 style="font-size:2em;">¿Aceptas ser mi novia oficial?</h1>
  <button class="btn btn-final" onclick="final()">SÍ, ACEPTO 💖</button>
</div>

<script>
// CORAZONES
const canvas = document.getElementById('hearts'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let hearts = [];
function Heart(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height-50; this.size=Math.random()*15+10; this.speed=Math.random()*2+1; this.opacity=0.6; }
Heart.prototype.draw=function(){ ctx.fillStyle=`rgba(255,105,180,${this.opacity})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); if(hearts.length<50) hearts.push(new Heart()); hearts.forEach((h,i)=>{ h.y+=h.speed; h.opacity-=0.002; h.draw(); if(h.y>canvas.height || h.opacity<=0) hearts.splice(i,1); }); requestAnimationFrame(animate); }
animate();

// MUSICA
const musica = document.getElementById('musica'); let reproduciendo = false;
function toggleMusica(){ if(reproduciendo){ musica.pause(); btnMusica.innerHTML='▶️'; } else { musica.play(); btnMusica.innerHTML='⏸️'; } reproduciendo = !reproduciendo; }

// BOTON NO INFINITO
const frasesNo = [
  'NO', '¿Segura? 🥺', 'Piénsalo bien', 'Dale otra oportunidad', 'Porfaaa', 
  'Última oportunidad', '¿En serio NO?', 'Me vas a romper el corazón', 'Inténtalo',
  'Solo di SÍ', 'Te espero', 'No seas mala', 'Por Lucerito', '¿Y si SÍ?',
  'Te lo ruego', 'Una más', 'Ya pues', 'Te amo', 'Dale click al SÍ', 'Rendición 😭'
];
let contadorNo = 0;
const btnNo = document.getElementById('no');
btnNo.addEventListener('mouseover', ()=>{ 
  const maxX = window.innerWidth - btnNo.offsetWidth - 20;
  const maxY = window.innerHeight - btnNo.offsetHeight - 20;
  btnNo.style.left = Math.random()*maxX + 'px';
  btnNo.style.top = Math.random()*maxY + 'px';
  btnNo.innerText = frasesNo[contadorNo % frasesNo.length];
  contadorNo++;
  btnNo.style.transform = `rotate(${Math.random()*20-10}deg)`;
});

// LLUVIA DE NOMBRES
function lluviaNombres(){
  const nombres = ['Lucero', 'Mi amor', 'Preciosa', 'Chiquita', 'Bonita', 'Mi vida', 'Única', 'Amor'];
  setInterval(()=>{
    let n = document.createElement('div');
    n.className = 'nombre-flotante';
    n.innerText = nombres[Math.floor(Math.random()*nombres.length)];
    n.style.left = Math.random()*100+'vw';
    n.style.fontSize = Math.random()*10+20+'px';
    document.body.appendChild(n);
    setTimeout(()=>n.remove(), 4000);
  }, 300);
}

// MAQUINA DE ESCRIBIR
function escribirCarta(texto, elemento){
  let i = 0;
  function type(){
    if(i < texto.length){
      elemento.innerHTML = texto.substring(0, i+1) + '<span class="cursor">|</span>';
      i++; setTimeout(type, 50);
    } else { elemento.innerHTML = texto; }
  }
  type();
}

// ACEPTAR PANTALLA 2
function aceptar(){
  document.getElementById('pantalla1').classList.add('hidden');
  document.getElementById('pantalla2').classList.remove('hidden');
  musica.play(); btnMusica.innerHTML='⏸️'; reproduciendo=true;
  lluviaNombres();
  
  const piropos = ['Hermosa','Bonita','Preciosa','Chiquita','Flaquita','Lucero','Única','Especial','Dulce','Mi favorita'];
  const cont = document.getElementById('piropos');
  piropos.forEach((p,i)=> setTimeout(()=>{ 
    let span=document.createElement('span'); span.className='piropo'; span.textContent=p; cont.appendChild(span);
  }, i*150));
  
  setTimeout(()=>{
    const textoCarta = `Lucero Paucar...
Desde que supe tu nombre supe que iluminarías mi vida.
Eres chiquita, bonita y flaquita, pero con un corazón gigante.
Prometo cuidarte, hacerte reír y quererte todos los días. 💕`;
    escribirCarta(textoCarta, document.getElementById('carta'));
  }, 1200);
}

// IR A PROPUESTA FINAL
function propuesta(){
  document.getElementById('pantalla2').classList.add('hidden');
  document.getElementById('pantalla3').classList.remove('hidden');
}

// FINAL
function final(){
  alert('¡Eres oficialmente mi novia! 💖 Te amo Lucero');
}
</script>
</body>
</html>
