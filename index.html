<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristhofer & Lucero - 1 Mes ❤️</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    color: #333;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 { color: #d6336c; margin-bottom: 5px; font-size: 2.6rem; }
  .nombres { font-size: 1.4rem; color: #a61e4d; margin-bottom: 10px; font-weight: 600; }
  .sub { font-size: 1rem; margin-bottom: 30px; color: #555; }
  
  .contador {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(214, 51, 108, 0.2);
    max-width: 520px;
    margin: 0 auto 40px;
  }
  .tiempo { display: flex; justify-content: space-around; margin-top: 15px; flex-wrap: wrap; gap: 10px; }
  .tiempo div { background: #ffe3e9; padding: 15px; border-radius: 12px; min-width: 80px; }
  .tiempo span { font-size: 2rem; font-weight: bold; color: #d6336c; display: block; }

  .galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    max-width: 900px;
    margin: 0 auto 40px;
  }
  .galeria img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: transform 0.3s;
  }
  .galeria img:hover { transform: scale(1.06); }

  .mensaje {
    margin: 30px auto;
    font-size: 1.3rem;
    color: #d6336c;
    font-style: italic;
    max-width: 600px;
  }

  audio { margin-top: 20px; width: 300px; max-width: 90%; }
</style>
</head>
<body>

  <h1>1 Mes Juntos ❤️</h1>
  <p class="nombres">Cristhofer & Lucero</p>
  <p class="sub">Desde el 06/07/2026 - 4:23pm</p>

  <div class="contador">
    <h2>Nuestro tiempo:</h2>
    <div class="tiempo">
      <div><span id="dias">0</span>Días</div>
      <div><span id="horas">0</span>Horas</div>
      <div><span id="minutos">0</span>Min</div>
      <div><span id="segundos">0</span>Seg</div>
    </div>
  </div>

  <h2>Nuestra galería 💕</h2>
  <div class="galeria">
    <img src="https://files.evogb.win/rA6oiw.jpg" alt="Foto 1">
    <img src="https://files.evogb.win/WCDwKJ.jpg" alt="Foto 2">
    <img src="https://files.evogb.win/Ya4UNB.jpg" alt="Foto 3">
    <img src="https://files.evogb.win/zGwPRv.jpg" alt="Foto 4">
    <img src="https://files.evogb.win/dh6Y5p.jpg" alt="Foto 5">
  </div>

  <p class="mensaje">
    Gracias por este primer mes, Lucero. <br>
    Eres mi persona favorita, Cristhofer. <br>
    Por muchos meses más juntos ✨
  </p>

  <audio id="musica" controls loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

<script>
  // Fecha exacta: 6 de Julio 2026, 4:23 PM
  const fechaInicio = new Date(2026, 6, 6, 16, 23, 0); // Mes 6 = Julio
  
  function actualizarContador() {
    const ahora = new Date();
    let diff = ahora - fechaInicio;
    
    if(diff < 0) diff = 0; // por si acaso

    const dias = Math.floor(diff / (1000*60*60*24));
    const horas = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const minutos = Math.floor((diff % (1000*60*60)) / (1000*60));
    const segundos = Math.floor((diff % (1000*60)) / 1000);

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = horas;
    document.getElementById("minutos").textContent = minutos;
    document.getElementById("segundos").textContent = segundos;
  }
  
  // Actualizar al cargar y cada segundo
  actualizarContador();
  setInterval(actualizarContador, 1000);
</script>

</body>
</html>
