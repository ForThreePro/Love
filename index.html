<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucero Mi Esposa ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');
  
    * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
    font-family: 'Poppins', sans-serif;
    color: #fff;
    min-height: 100vh;
  }
  
  /* CORAZONES FLOTANDO */
  .corazon {
    position: fixed; top: -10vh; font-size: 1.8rem; color: rgba(255,255,255,0.6);
    animation: caer 12s linear infinite; z-index: 0;
  }
  @keyframes caer {
    to { transform: translateY(110vh) rotate(720deg); }
  }
  
  .container {
    position: relative; z-index: 2; text-align: center; padding: 50px 20px;
  }
  
  h1 {
    font-family: 'Great Vibes', cursive; font-size: 4.5rem;
    text-shadow: 3px 3px 15px rgba(0,0,0,0.3); margin-bottom: 15px;
    animation: latir 2s infinite;
  }
  @keyframes latir { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  
  .subtitulo {
    font-size: 1.4rem; margin-bottom: 30px; font-weight: 300;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
  }
  
  /* REPRODUCTOR */
  .music-player {
    margin: 30px 0; background: rgba(255,255,255,0.25); padding: 20px;
    border-radius: 25px; backdrop-filter: blur(10px); display: inline-block;
  }
  .btn-music {
    background: linear-gradient(90deg, #ff6b9d, #ff8fab); color: white; border: none; 
    padding: 15px 40px; border-radius: 50px; font-size: 1.1rem; cursor: pointer; 
    font-weight: 600; box-shadow: 0 5px 25px rgba(255,107,157,0.6); transition: 0.3s;
  }
  .btn-music:hover { transform: scale(1.1); }
  
  /* GALERIA */
  .galeria {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px; max-width: 1300px; margin: 40px auto;
  }
  
  .foto {
    background: #fff; padding: 12px; border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25); transition: 0.4s;
  }
  .foto:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 20px 50px rgba(255,105,180,0.5); }
  .foto img {
    width: 100%; height: 400px; object-fit: cover; border-radius: 15px;
  }
  
  .frase {
    margin-top: 50px; font-size: 1.8rem; font-family: 'Great Vibes', cursive;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  }
  
  footer {
    margin-top: 40px; font-size: 0.9rem; opacity: 0.8;
  }
</style>
</head>
<body>
  <audio id="musica" loop><source src="musica.mp3" type="audio/mpeg"></audio>
  
  <div class="container">
    <h1>Lucero Mi Esposa ❤️</h1>
    <p class="subtitulo">Los mejores momentos de nuestra vida juntos</p>
    
    <div class="music-player">
      <button class="btn-music" onclick="toggleMusic()">▶️ TOCA PARA ESCUCHAR</button>
    </div>
    
    <div class="galeria">
      <div class="foto"><img src="https://files.evogb.win/rA6oiw.jpg" alt="Nuestro recuerdo 1"></div>
      <div class="foto"><img src="https://files.evogb.win/WCDwKJ.jpg" alt="Nuestro recuerdo 2"></div>
      <div class="foto"><img src="https://files.evogb.win/Ya4UNB.jpg" alt="Nuestro recuerdo 3"></div>
      <div class="foto"><img src="https://files.evogb.win/zGwPRv.jpg" alt="Nuestro recuerdo 4"></div>
      <div class="foto"><img src="https://files.evogb.win/dh6Y5p.jpg" alt="Nuestro recuerdo 5"></div>
    </div>
    
    <p class="frase">"Contigo cada día es San Valentín"</p>
    
    <footer>Hecho con mucho amor para ti ❤️</footer>
  </div>

<script>
  const audio = document.getElementById('musica');
  const btn = document.querySelector('.btn-music');
  
  function toggleMusic() {
    if(audio.paused) {
      audio.play().catch(()=>{}); 
      btn.innerHTML = '⏸️ PAUSAR MÚSICA';
    } else {
      audio.pause(); 
      btn.innerHTML = '▶️ TOCA PARA ESCUCHAR';
    }
  }
  
  // CORAZONES CAYENDO
  function crearCorazon() {
    const corazon = document.createElement('div');
    corazon.className = 'corazon';
    corazon.innerHTML = '❤️';
    corazon.style.left = Math.random() * 100 + 'vw';
    corazon.style.animationDuration = (8 + Math.random() * 6) + 's';
    document.body.appendChild(corazon);
    setTimeout(() => corazon.remove(), 12000);
  }
  setInterval(crearCorazon, 400);
</script>
</body>
</html>
