<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Lucero Paucar 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(135deg, #ff9ec9 0%, #ffd6e8 100%);
    font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { position: fixed; top:0; left:0; z-index: 0; }
  
  .container {
    position: relative; z-index: 2; text-align: center; 
    background: rgba(255,255,255,0.95); padding: 40px; border-radius: 30px;
    box-shadow: 0 15px 50px rgba(214,51,132,0.3); max-width: 550px;
  }
  h1 { color: #d63384; font-size: 2.5em; margin-bottom: 10px; font-family: 'Dancing Script', cursive; }
  .sub { color: #a63a6a; font-size: 1.2em; margin-bottom: 25px; }
  .btn {
    padding: 15px 40px; font-size: 1.3em; border: none; border-radius: 50px;
    cursor: pointer; margin: 10px; font-weight: bold; transition: 0.3s;
  }
  #si { background: #ff5e94; color: white; }
  #si:hover { transform: scale(1.1); }
  #no { background: white; color: #ff5e94; position: absolute; border: 2px solid #ff5e94; }
  
  #btnMusica {
    position: fixed; top: 20px; right: 20px; z-index: 999;
    background: rgba(255,255,255,0.9); border: none; border-radius: 50%;
    width: 50px; height: 50px; font-size: 1.5em; cursor: pointer;
  }
  
  .piropos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; }
  .piropo {
    background: linear-gradient(45deg, #ff5e94, #ff9ec9); color: white; 
    padding: 10px 18px; border-radius: 25px; font-weight: 600; animation: pop 0.5s;
  }
  @keyframes pop { from{transform:scale(0)} to{transform:scale(1)} }
  
  #carta {
    font-family: 'Dancing Script', cursive; font-size: 1.4em; color: #d63384;
    text-align: left; margin-top: 20px; min-height: 120px; line-height: 1.6;
  }
  .cursor { animation: blink 1s infinite; }
  @keyframes blink { 50%{opacity:0} }
  .hidden { display: none; }
</style>
</head>
<body>

<canvas id="hearts"></canvas>

<button id="btnMusica" onclick="toggleMusica()">▶️</button>
<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div class="container" id="pantalla1">
  <h1>Lucero Paucar 🥺</h1>
  <p class="sub">Tengo algo muy importante que decirte...</p>
  <h1>¿Quieres ser mi novia?</h1>
  <button class="btn" id="si" onclick="aceptar()">SÍ ❤️</button>
  <button class="btn" id="no">NO</button>
</div>

<div class="container hidden" id="pantalla2">
  <h1>¡Sabía que dirías SÍ! 😍💖</h1>
  <p style="font-size:1.2em; color:#a63a6a;">Porque tú eres:</p>
  <div class="piropos" id="piropos"></div>
  
  <div id="carta"></div>
  
  <p style="margin-top:20px; color:#d63384; font-weight:bold;">Gracias por iluminar mi vida como tu nombre ✨</p>
</div>

<script>
// CORAZONES
const canvas = document.getElementById('hearts'); const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let hearts = [];
function Heart(){ this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height-50; this.size=Math.random()*15+10; this.speed=Math.random()*2+1; }
Heart.prototype.draw=function(){ ctx.fillStyle='rgba(255,105,180,0.6)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
function animate(){ ctx.clearRect(0,0,canvas.width,canvas.height); if(hearts.length<40) hearts.push(new Heart()); hearts.forEach((h,i)=>{ h.y+=h.speed; h.draw(); if(h.y>canvas.height) hearts.splice(i,1); }); requestAnimationFrame(animate); }
animate();

// MUSICA
const musica = document.getElementById('musica'); let reproduciendo = false;
function toggleMusica(){ if(reproduciendo){ musica.pause(); btnMusica.innerHTML='▶️'; } else { musica.play(); btnMusica.innerHTML='⏸️'; } reproduciendo = !reproduciendo; }

// BOTON NO CON FRASES CHISTOSAS
const frasesNo = ['NO', '¿Segura? 🥺', 'Piénsalo bien', 'Dale otra oportunidad', 'Porfaaa', 'Última oportunidad', '¿En serio NO?', 'Me vas a romper el corazón'];
let contadorNo = 0;
const btnNo = document.getElementById('no');
btnNo.addEventListener('mouseover', ()=>{ 
  btnNo.style.left = Math.random()*(window.innerWidth-150)+'px';
  btnNo.style.top = Math.random()*(window.innerHeight-150)+'px';
  btnNo.innerText = frasesNo[contadorNo % frasesNo.length];
  contadorNo++;
});

// EFECTO MAQUINA DE ESCRIBIR
function escribirCarta(texto, elemento){
  let i = 0;
  function type(){
    if(i < texto.length){
      elemento.innerHTML = texto.substring(0, i+1) + '<span class="cursor">|</span>';
      i++; setTimeout(type, 60);
    } else {
      elemento.innerHTML = texto; // quita el cursor al final
    }
  }
  type();
}

// ACEPTAR
function aceptar(){
  document.getElementById('pantalla1').classList.add('hidden');
  document.getElementById('pantalla2').classList.remove('hidden');
  musica.play(); btnMusica.innerHTML='⏸️'; reproduciendo=true;
  
  const piropos = ['Hermosa','Bonita','Preciosa','Chiquita','Flaquita','Lucero','Única','Especial','Dulce','Mi favorita','Mi universo'];
  const cont = document.getElementById('piropos');
  piropos.forEach((p,i)=> setTimeout(()=>{ 
    let span=document.createElement('span'); span.className='piropo'; span.textContent=p; cont.appendChild(span);
  }, i*200));
  
  // CARTA PERSONALIZADA
  setTimeout(()=>{
    const textoCarta = `Lucero Paucar...
Desde que supe tu nombre supe que iluminarías mi vida.
Eres chiquita, bonita y flaquita, pero con un corazón gigante.
¿Me das la oportunidad de cuidarte y hacerte feliz todos los días? 💕`;
    escribirCarta(textoCarta, document.getElementById('carta'));
  }, 1500);
}
</script>
</body>
</html>
